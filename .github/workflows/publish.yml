name: Publish

# Manual trigger — publish to crates.io after a GitHub release is created,
# then auto-announce the release on industrialalgebra.com.
# This is invoked from the Actions tab with the version as input.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g. 0.3.0)'
        required: true
        type: string

env:
  CARGO_TERM_COLOR: always

jobs:
  publish:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2

      - name: Verify version
        run: |
          CARGO_VERSION=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          if [ "$CARGO_VERSION" != "${{ inputs.version }}" ]; then
            echo "Error: Cargo.toml version ($CARGO_VERSION) does not match input (${{ inputs.version }})"
            exit 1
          fi
          echo "Publishing Minuet v$CARGO_VERSION"

      - name: Publish
        run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  # Auto-announce on industrialalgebra.com after a successful crates.io publish.
  # Calls the IA-home reusable workflow, which derives the title/slug/body from
  # product_name + version + release_notes and POSTs to the blog admin API.
  #
  # Requires the IA_BLOG_API_KEY repo secret (= the industrialalgebra.com
  # ADMIN_API_KEY). Without it, this job fails with 401 — add the secret first.
  announce:
    name: Announce on industrialalgebra.com
    needs: publish
    uses: Industrial-Algebra/IA-home/.github/workflows/release-announce.yml@main
    with:
      product_name: "Minuet"
      version: "v${{ inputs.version }}"
      release_notes: "See the full changelog: https://github.com/Industrial-Algebra/Minuet/blob/main/CHANGELOG.md"
    secrets:
      ADMIN_API_KEY: ${{ secrets.IA_BLOG_API_KEY }}
